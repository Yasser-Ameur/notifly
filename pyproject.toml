[project]
name = "notifly-server"
version = "0.1.0"
description = "NotiFly — a production-grade, channel-agnostic notification orchestration platform."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "NotiFly contributors" }]
keywords = ["notifications", "webhooks", "email", "slack", "discord", "teams", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
]

dependencies = [
    "aiosmtplib>=3.0.2",
    "alembic>=1.14.0",
    "arq>=0.26.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.4",
    "prometheus-client>=0.21.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-json-logger>=3.2.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notifly"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "sdk/src", "sdk/tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"sdk/tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
show_error_codes = true
exclude = ["sdk/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arq.*", "aiosmtplib.*", "pythonjsonlogger.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=notifly --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["notifly"]
branch = true
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "^import .*",
    "^from .*",
    "^\\.\\.\\.$",
    ": \\.\\.\\.$",
]
